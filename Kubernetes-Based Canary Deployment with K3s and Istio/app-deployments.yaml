# --- Version 1 (Stable) Deployment ---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: canary-app-v1
  labels:
    app: canary-app
    version: v1
spec:
  replicas: 2
  selector:
    matchLabels:
      app: canary-app
      version: v1
  template:
    metadata:
      labels:
        app: canary-app
        version: v1
    spec:
      containers:
      - name: canary-app
        image: sam2127/canary-app:v1  # <-- Replace with your real image or keep local
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 5000
        env:
        - name: APP_VERSION
          value: "v1.0"
        resources:
          requests:
            cpu: "50m"
            memory: "64Mi"
          limits:
            cpu: "200m"
            memory: "128Mi"
---
# --- Version 2 (Canary) Deployment ---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: canary-app-v2
  labels:
    app: canary-app
    version: v2
spec:
  replicas: 1
  selector:
    matchLabels:
      app: canary-app
      version: v2
  template:
    metadata:
      labels:
        app: canary-app
        version: v2
    spec:
      containers:
      - name: canary-app
        image: sam2127/canary-app:v2   # <-- Replace with your real image or keep local
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 5000
        env:
        - name: APP_VERSION
          value: "v2.0"
        resources:
          requests:
            cpu: "50m"
            memory: "64Mi"
          limits:
            cpu: "200m"
            memory: "128Mi"
---
# --- Shared Service ---
apiVersion: v1
kind: Service
metadata:
  name: canary-app-service
  labels:
    app: canary-app
spec:
  ports:
  - port: 80
    targetPort: 5000
    name: http
  selector:
    app: canary-app