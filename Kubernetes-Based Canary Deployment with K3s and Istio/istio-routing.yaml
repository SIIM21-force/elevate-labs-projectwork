# 1. Gateway: Accepts external HTTP traffic
apiVersion: networking.istio.io/v1alpha3
kind: Gateway
metadata:
  name: canary-gateway
spec:
  selector:
    istio: ingress
  servers:
  - port:
      number: 80
      name: http
      protocol: HTTP
    hosts:
    - "*"
---
# 2. DestinationRule: Defines subsets v1 and v2
apiVersion: networking.istio.io/v1alpha3
kind: DestinationRule
metadata:
  name: canary-destination-rule
spec:
  host: canary-app-service
  subsets:
  - name: v1
    labels:
      version: v1
  - name: v2
    labels:
      version: v2
---
# 3. VirtualService: Traffic Splitting (80% v1, 20% v2)
apiVersion: networking.istio.io/v1alpha3
kind: VirtualService
metadata:
  name: canary-virtual-service
spec:
  hosts:
  - "*"
  gateways:
  - canary-gateway
  http:
  - route:
    - destination:
        host: canary-app-service
        subset: v1
      weight: 80
    - destination:
        host: canary-app-service
        subset: v2
      weight: 20